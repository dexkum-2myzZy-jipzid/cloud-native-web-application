name: Continuous Deploy

on:
  push:
    branches:
      - test/github-actions # for testing
      - main
  pull_request:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: AWS_DEPLOYMENT

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Check EC2 instance status
        id: check-status
        run: |
          echo "Checking EC2 instance status..."
          state=$(aws ec2 describe-instances --instance-ids ${{ secrets.AWS_EC2_INSTANCE_ID }} --query "Reservations[0].Instances[0].State.Name" --output text)
          echo "Instance state: $state"
          echo "instance_state=$state" >> $GITHUB_ENV

      - name: Start EC2 instance if stopped
        if: env.instance_state != 'running'
        run: |
          echo "Starting EC2 instance..."
          aws ec2 start-instances --instance-ids ${{ secrets.AWS_EC2_INSTANCE_ID }}
          echo "Instance started."

      - name: Wait for EC2 instance to be running
        if: env.instance_state != 'running'
        run: |
          echo "Waiting for EC2 instance to be running..."
          aws ec2 wait instance-running --instance-ids ${{ secrets.AWS_EC2_INSTANCE_ID }}
          echo "Instance is now running."

      - name: Get EC2 instance public IP
        id: get-ip
        run: |
          echo "Getting EC2 instance public IP..."
          PUBLIC_IP=$(aws ec2 describe-instances --instance-ids ${{ secrets.AWS_EC2_INSTANCE_ID }} --query "Reservations[0].Instances[0].PublicIpAddress" --output text)
          echo "Public IP: $PUBLIC_IP"
          echo "PUBLIC_IP=$PUBLIC_IP" >> $GITHUB_ENV

      - name: Deploy Flask App to EC2
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          SSH_HOST: ${{ env.PUBLIC_IP }}
          SSH_USER: ${{ vars.SSH_USER }}
        run: |
          echo "Deploying Flask App to EC2..."
          echo "$EC2_SSH_KEY" > ec2_key.pem
          chmod 600 ec2_key.pem

          ssh -o StrictHostKeyChecking=no -i ec2_key.pem $SSH_USER@$SSH_HOST << 'EOF'
          echo "Stopping running app if it exists..."
          pkill -f app.py || true

          echo "Removing existing app directory..."
          rm -rf /home/ubuntu/app

          echo "Creating new deployment directory..."
          mkdir -p /home/ubuntu/app
          cd /home/ubuntu/app

          echo "Installing necessary packages..."
          sudo apt-get update
          sudo apt-get install -y python3-venv python3-pip

          echo "Creating and activating virtual environment..."
          python3 -m venv venv
          source venv/bin/activate

          echo "Installing dependencies from requirements.txt..."
          exit
          EOF

          echo "Copying all files from root to EC2..."
          scp -o StrictHostKeyChecking=no -i -r ./* $SSH_USER@$SSH_HOST:/home/ubuntu/app/

          echo "Installing dependencies from requirements.txt on EC2..."
          ssh -o StrictHostKeyChecking=no -i ec2_key.pem $SSH_USER@$SSH_HOST << 'EOF'
          cd /home/ubuntu/app
          source venv/bin/activate
          pip install -r requirements.txt
          exit
          EOF

          echo "Starting Flask app..."
          ssh -o StrictHostKeyChecking=no -i ec2_key.pem $SSH_USER@$SSH_HOST << 'EOF'
          cd /home/ubuntu/app
          source venv/bin/activate
          nohup python app.py > app.log 2>&1 &
          exit
          EOF

      - name: Output Application URL
        run: echo "Application is running at http://${{ env.PUBLIC_IP }}:8080"

      - name: Setup Variables for Grader Workflow
        run: |
          echo "SSH_HOST=${{ env.PUBLIC_IP }}" > grader-env.txt
          echo "SSH_USER=${{ vars.SSH_USER }}" >> grader-env.txt

      - name: Upload Grader Environment Variables
        uses: actions/upload-artifact@v4
        with:
          name: grader-env
          path: grader-env.txt
